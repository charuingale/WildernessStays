services:
  postgres:
    image: postgres:16-alpine
    container_name: wilderness_postgres
    environment:
      POSTGRES_USER: wilderness
      POSTGRES_PASSWORD: wilderness
      POSTGRES_DB: wilderness_stays
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wilderness"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: wilderness_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
