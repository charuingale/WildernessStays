services:
  postgres:
    image: postgres:16-alpine
    container_name: wilderness_postgres_net
    environment:
      POSTGRES_USER: wilderness
      POSTGRES_PASSWORD: wilderness
      POSTGRES_DB: wilderness_stays_net
    ports:
      - "5434:5432"
    volumes:
      - pgdata_net:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wilderness"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: wilderness_redis_net
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata_net:
